<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بنار ديكور البيت</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    header h1 {
      color: #667eea;
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    header p {
      color: #666;
      font-size: 1.1em;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav-tabs button {
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.8);
      color: #667eea;
      font-weight: 600;
    }

    .nav-tabs button.active {
      background: #667eea;
      color: white;
      transform: scale(1.05);
    }

    .nav-tabs button:hover {
      background: rgba(102, 126, 234, 0.9);
      color: white;
    }

    .content-section {
      display: none;
    }

    .content-section.active {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Designer Section */
    .designer-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .designer-preview {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      min-height: 500px;
      position: relative;
    }

    .designer-preview h3 {
      color: #667eea;
      margin-bottom: 15px;
    }

    .room-preview {
      width: 100%;
      height: 400px;
      background: linear-gradient(180deg, #87CEEB 0%, #E0FFFF 50%, #D2B48C 100%);
      border: 2px solid #ddd;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .furniture-item {
      position: absolute;
      width: 80px;
      height: 60px;
      background: #8B7355;
      border: 2px solid #5C4033;
      cursor: move;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.8em;
      border-radius: 4px;
      opacity: 0.9;
      transition: all 0.3s ease;
    }

    .furniture-item:hover {
      opacity: 1;
      transform: scale(1.05);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .control-section {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .control-section h3 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.1em;
    }

    .control-group {
      margin-bottom: 20px;
    }

    .control-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    .control-group input[type="color"],
    .control-group input[type="range"],
    .control-group select {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
    }

    .control-group input[type="color"] {
      height: 45px;
      cursor: pointer;
    }

    .color-preview {
      width: 100%;
      height: 60px;
      border-radius: 5px;
      border: 2px solid #ddd;
      margin-top: 10px;
    }

    /* Gallery Section */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .gallery-item {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .gallery-item:hover {
      transform: translateY(-10px);
    }

    .gallery-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .gallery-item-content {
      padding: 15px;
    }

    .gallery-item-content h4 {
      color: #667eea;
      margin-bottom: 8px;
    }

    .gallery-item-content p {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 10px;
    }

    .gallery-item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rating {
      color: #ffc107;
      font-weight: bold;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: scale(1.02);
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    .furniture-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .furniture-option {
      padding: 12px;
      background: #f0f0f0;
      border: 2px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s ease;
    }

    .furniture-option:hover {
      border-color: #667eea;
      background: #f9f9ff;
      transform: scale(1.05);
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .palette-color {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.3s ease;
    }

    .palette-color:hover {
      border-color: #333;
      transform: scale(1.1);
    }

    .palette-color.selected {
      border-color: #667eea;
      box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
    }

    .search-bar {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 1em;
      margin-bottom: 20px;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      header h1 {
        font-size: 1.8em;
      }

      .designer-container {
        grid-template-columns: 1fr;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }

      .nav-tabs {
        flex-direction: column;
      }

      .nav-tabs button {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 10px;
      }

      header h1 {
        font-size: 1.5em;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .control-section {
        padding: 15px;
      }
    }

    .stats {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      text-align: center;
      min-width: 200px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .stat-card .number {
      color: #667eea;
      font-size: 2em;
      font-weight: bold;
    }

    .stat-card .label {
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏠 Banar Home Decor</h1>
      <p>بنار ديكور البيت - صمم غرفتك الحلم بسهولة</p>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="number">1000+</div>
        <div class="label">منتج ديكور</div>
      </div>
      <div class="stat-card">
        <div class="number">500+</div>
        <div class="label">تصميم جاهز</div>
      </div>
      <div class="stat-card">
        <div class="number">50+</div>
        <div class="label">لوحة ألوان</div>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="designer">🎨 محرر الديكور</button>
      <button class="tab-btn" data-tab="gallery">🖼️ المعرض</button>
      <button class="tab-btn" data-tab="furniture">🛋️ الأثاث</button>
      <button class="tab-btn" data-tab="colors">🎭 لوحات الألوان</button>
    </div>

    <!-- Designer Tab -->
    <div class="content-section active" id="designer">
      <div class="designer-container">
        <div class="designer-preview">
          <h3>معاينة الغرفة 👁️</h3>
          <div class="room-preview" id="roomPreview">
            <p>اسحب الأثاث إلى هنا</p>
          </div>
        </div>

        <div class="controls">
          <div class="control-section">
            <h3>نوع الغرفة</h3>
            <div class="control-group">
              <select id="roomType" onchange="changeRoomType(this.value)">
                <option value="living">غرفة المعيشة</option>
                <option value="bedroom">غرفة النوم</option>
                <option value="kitchen">المطبخ</option>
                <option value="bathroom">الحمام</option>
                <option value="office">مكتب</option>
              </select>
            </div>

            <h3 style="margin-top: 20px;">الجدران</h3>
            <div class="control-group">
              <label>لون الجدران</label>
              <input type="color" id="wallColor" value="#FFFFFF" onchange="updateWallColor(this.value)">
              <div class="color-preview" id="wallColorPreview" style="background: #FFFFFF;"></div>
            </div>

            <div class="control-group">
              <label>نمط الجدران</label>
              <select id="wallPattern" onchange="updateWallPattern(this.value)">
                <option value="">بدون نمط</option>
                <option value="dots">نقاط</option>
                <option value="lines">خطوط</option>
                <option value="grid">شبكة</option>
              </select>
            </div>
          </div>

          <div class="control-section">
            <h3>الإضاءة</h3>
            <div class="control-group">
              <label>سطوع الإضاءة</label>
              <input type="range" id="brightness" min="30" max="100" value="80" onchange="updateBrightness(this.value)">
              <small id="brightnessValue">80%</small>
            </div>

            <div class="control-group">
              <label>لون الإضاءة</label>
              <input type="color" id="lightColor" value="#FFFF99" onchange="updateLightColor(this.value)">
            </div>

            <h3 style="margin-top: 20px;">الأرضية</h3>
            <div class="control-group">
              <label>لون الأرضية</label>
              <input type="color" id="floorColor" value="#D2B48C" onchange="updateFloorColor(this.value)">
              <div class="color-preview" id="floorColorPreview" style="background: #D2B48C;"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="control-section">
        <h3>أضف أثاث</h3>
        <div class="furniture-list">
          <div class="furniture-option" onclick="addFurniture('sofa', 'أريكة')">🛋️ أريكة</div>
          <div class="furniture-option" onclick="addFurniture('table', 'طاولة')">🪑 طاولة</div>
          <div class="furniture-option" onclick="addFurniture('bed', 'سرير')">🛏️ سرير</div>
          <div class="furniture-option" onclick="addFurniture('shelf', 'رف')">📚 رف</div>
          <div class="furniture-option" onclick="addFurniture('lamp', 'مصباح')">💡 مصباح</div>
          <div class="furniture-option" onclick="addFurniture('chair', 'كرسي')">🪑 كرسي</div>
          <div class="furniture-option" onclick="addFurniture('desk', 'مكتب')">📝 مكتب</div>
          <div class="furniture-option" onclick="addFurniture('rug', 'سجادة')">🟫 سجادة</div>
        </div>
      </div>

      <div style="text-align: center; margin-top: 20px;">
        <button class="btn btn-primary" onclick="saveDesign()">💾 حفظ التصميم</button>
        <button class="btn btn-secondary" onclick="clearDesign()" style="margin-right: 10px;">🔄 مسح الكل</button>
      </div>
    </div>

    <!-- Gallery Tab -->
    <div class="content-section" id="gallery">
      <input type="text" class="search-bar" placeholder="ابحث عن تصاميم...">
      <div class="gallery" id="galleryContainer">
        <!-- Items will be populated by JavaScript -->
      </div>
    </div>

    <!-- Furniture Tab -->
    <div class="content-section" id="furniture">
      <div style="margin-bottom: 20px;">
        <button class="btn btn-primary" onclick="filterFurniture('all')">الكل</button>
        <button class="btn btn-secondary" onclick="filterFurniture('seating')">أثاث جلوس</button>
        <button class="btn btn-secondary" onclick="filterFurniture('table')">طاولات</button>
        <button class="btn btn-secondary" onclick="filterFurniture('storage')">تخزين</button>
        <button class="btn btn-secondary" onclick="filterFurniture('lighting')">إضاءة</button>
      </div>
      <div class="gallery" id="furnitureContainer">
        <!-- Furniture items will be populated by JavaScript -->
      </div>
    </div>

    <!-- Colors Tab -->
    <div class="content-section" id="colors">
      <h2>لوحات الألوان المقترحة</h2>
      <div id="colorPalettesContainer">
        <!-- Color palettes will be populated by JavaScript -->
      </div>
    </div>
  </div>

  <script>
    let design = {
      roomType: 'living',
      furniture: [],
      walls: { color: '#FFFFFF', pattern: '' },
      floor: { color: '#D2B48C', material: 'wood' },
      lighting: { brightness: 80, color: '#FFFF99' },
      accessories: []
    };

    let furnitureCounter = 0;

    // Tab Navigation
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    function changeRoomType(type) {
      design.roomType = type;
      const backgrounds = {
        living: 'linear-gradient(180deg, #87CEEB 0%, #E0FFFF 50%, #D2B48C 100%)',
        bedroom: 'linear-gradient(180deg, #FFB6C1 0%, #FFC0CB 50%, #E0B8D8 100%)',
        kitchen: 'linear-gradient(180deg, #FFFACD 0%, #FFFFE0 50%, #F0E68C 100%)',
        bathroom: 'linear-gradient(180deg, #B0E0E6 0%, #AFEEEE 50%, #E0FFFF 100%)',
        office: 'linear-gradient(180deg, #D3D3D3 0%, #E8E8E8 50%, #F5F5F5 100%)'
      };
      document.getElementById('roomPreview').style.background = backgrounds[type];
    }

    function updateWallColor(color) {
      design.walls.color = color;
      document.getElementById('wallColorPreview').style.background = color;
    }

    function updateWallPattern(pattern) {
      design.walls.pattern = pattern;
    }

    function updateFloorColor(color) {
      design.floor.color = color;
      document.getElementById('floorColorPreview').style.background = color;
      const preview = document.getElementById('roomPreview');
      preview.style.backgroundImage = `linear-gradient(180deg, ${design.walls.color} 0%, #E0FFFF 50%, ${color} 100%)`;
    }

    function updateBrightness(value) {
      design.lighting.brightness = value;
      document.getElementById('brightnessValue').textContent = value + '%';
      const preview = document.getElementById('roomPreview');
      preview.style.filter = `brightness(${value}%)`;
    }

    function updateLightColor(color) {
      design.lighting.color = color;
    }

    function addFurniture(type, name) {
      furnitureCounter++;
      const furniture = {
        id: `furniture-${furnitureCounter}`,
        name: name,
        type: type,
        color: '#8B7355',
        position: { x: Math.random() * 300, y: Math.random() * 300 },
        size: { width: 80, height: 60 }
      };

      const furnitureEmoji = {
        sofa: '🛋️',
        table: '🪑',
        bed: '🛏️',
        shelf: '📚',
        lamp: '💡',
        chair: '🪑',
        desk: '📝',
        rug: '🟫'
      };

      const preview = document.getElementById('roomPreview');
      const element = document.createElement('div');
      element.className = 'furniture-item';
      element.style.left = furniture.position.x + 'px';
      element.style.top = furniture.position.y + 'px';
      element.textContent = furnitureEmoji[type] || '📦';
      element.draggable = true;
      element.id = furniture.id;

      element.addEventListener('dragstart', e => {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', furniture.id);
      });

      preview.appendChild(element);
      design.furniture.push(furniture);
    }

    document.getElementById('roomPreview').addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });

    document.getElementById('roomPreview').addEventListener('drop', e => {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      const element = document.getElementById(id);
      if (element) {
        const rect = document.getElementById('roomPreview').getBoundingClientRect();
        element.style.left = (e.clientX - rect.left) + 'px';
        element.style.top = (e.clientY - rect.top) + 'px';
      }
    });

    function saveDesign() {
      const name = prompt('أدخل اسم التصميم:');
      if (name) {
        const designData = {
          name: name,
          description: `تصميم ${design.roomType}`,
          design: design,
          createdAt: new Date().toISOString()
        };
        localStorage.setItem(`design-${Date.now()}`, JSON.stringify(designData));
        alert('✅ تم حفظ التصميم بنجاح!');
      }
    }

    function clearDesign() {
      if (confirm('هل أنت متأكد من حذف التصميم؟')) {
        document.querySelectorAll('.furniture-item').forEach(el => el.remove());
        design.furniture = [];
      }
    }

    // Load Gallery
    function loadGallery() {
      const container = document.getElementById('galleryContainer');
      const savedDesigns = Object.keys(localStorage)
        .filter(key => key.startsWith('design-'))
        .map(key => JSON.parse(localStorage.getItem(key)))
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      if (savedDesigns.length === 0) {
        container.innerHTML = '<p>لا توجد تصاميم محفوظة حالياً</p>';
        return;
      }

      container.innerHTML = savedDesigns.map((d, i) => `
        <div class="gallery-item">
          <div style="background: linear-gradient(135deg, ${d.design.walls.color}, ${d.design.floor.color}); height: 200px;"></div>
          <div class="gallery-item-content">
            <h4>${d.name}</h4>
            <p>${d.design.roomType}</p>
            <div class="gallery-item-footer">
              <span class="rating">⭐ 4.5/5</span>
              <button class="btn btn-primary" style="padding: 5px 10px;">استخدم</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Load Furniture
    function loadFurniture() {
      const container = document.getElementById('furnitureContainer');
      const furnitureItems = [
        { name: 'أريكة جلد حمراء', category: 'seating', price: '2500 ريال', rating: 4.8 },
        { name: 'طاولة قهوة زجاجية', category: 'table', price: '800 ريال', rating: 4.6 },
        { name: 'رف كتب خشبي', category: 'storage', price: '1200 ريال', rating: 4.7 },
        { name: 'مصباح أرضي ذهبي', category: 'lighting', price: '600 ريال', rating: 4.9 },
        { name: 'كرسي جلوس مريح', category: 'seating', price: '1500 ريال', rating: 4.5 },
        { name: 'خزانة تخزين بيضاء', category: 'storage', price: '1800 ريال', rating: 4.4 }
      ];

      container.innerHTML = furnitureItems.map((item, i) => `
        <div class="gallery-item">
          <div style="background: linear-gradient(135deg, #667eea, #764ba2); height: 200px; display: flex; align-items: center; justify-content: center; font-size: 3em;">
            🛋️
          </div>
          <div class="gallery-item-content">
            <h4>${item.name}</h4>
            <p>${item.price}</p>
            <div class="gallery-item-footer">
              <span class="rating">⭐ ${item.rating}</span>
              <button class="btn btn-primary" style="padding: 5px 10px;">أضف للسلة</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterFurniture(category) {
      // Filter logic would go here
      loadFurniture();
    }

    // Initialize
    window.addEventListener('load', () => {
      loadGallery();
      loadFurniture();
    });
  </script>
</body>
</html>
